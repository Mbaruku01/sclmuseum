<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCL Login</title>
<script src="https://cdn.tailwindcss.com"></script>

<!-- FAVICON -->
<link rel="icon" type="image/x-icon" href="1000186051.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="1000186051.png">

<!-- Icons (CSS) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

<div class="flex flex-col-reverse md:flex-row bg-white rounded-2xl shadow-xl overflow-hidden w-full max-w-4xl">

  <!-- LEFT SIDE: Login Form -->
  <div class="w-full md:w-1/2 p-6 sm:p-10 flex flex-col justify-center">

    <h2 class="text-2xl sm:text-3xl font-semibold mb-3">Hello Again!</h2>
    <p class="text-gray-500 mb-6 text-sm sm:text-base">
      Welcome back, please login to your account.
    </p>

    <form id="loginForm" class="flex flex-col space-y-4">
  <input type="text" id="username" placeholder="Username" required
         class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500">
  <input type="password" id="password" placeholder="Password" required
         class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500">
  
  <!-- Admin Sign In -->
  <button type="submit" class="w-full bg-purple-700 text-white py-3 rounded-lg hover:bg-purple-800 transition font-semibold">
    Sign In
  </button>

  <!-- Employee Login -->
  <button type="button" id="employeeLogin" class="w-full bg-blue-700 text-white py-3 rounded-lg hover:bg-blue-800 transition font-semibold">
    Staff Login
  </button>
</form>

    <div class="flex justify-between items-center mt-4 text-gray-500 text-sm">
      <a href="forgotpasswordshop.html" id="forgotPassword" class="hover:text-purple-700">Forgot password?</a>
      <a href="signupshop.html" id="signUp" class="hover:text-purple-700">Sign up</a>
    </div>

    <!-- SOCIAL LOGIN -->
<div class="flex justify-center items-center mt-6 space-x-4">

  <!-- Google -->
  <button id="googleLogin"
    class="flex items-center justify-center w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200 transition">
    <i class="fa-brands fa-google text-red-500 text-lg"></i>
  </button>

  <!-- Apple -->
  <button id="appleLogin"
    class="flex items-center justify-center w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200 transition">
    <i class="fa-brands fa-apple text-black text-lg"></i>
  </button>

  <!-- Facebook -->
  <button id="facebookLogin"
    class="flex items-center justify-center w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200 transition">
    <i class="fa-brands fa-facebook-f text-blue-600 text-lg"></i>
  </button>

</div>

  </div>

  <!-- RIGHT SIDE: Illustration/Image -->
  <div class="w-full md:w-1/2 h-48 md:h-auto">
    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80" 
         alt="Login Illustration" class="w-full h-full object-cover">
  </div>

</div>

<script>
const form = document.getElementById('loginForm');

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;

  if(username === 'ADMIN' && password === '12345'){
    window.location.href = 'shop.html';
  } else {
    alert('Invalid credentials. Please try again.');
  }
});

document.getElementById('signUp').addEventListener('click', () => {
  alert('Redirecting to Sign Up');
});
document.getElementById('forgotPassword').addEventListener('click', () => {
  alert('Redirecting to Forgot Password page');
});
document.getElementById('googleLogin').addEventListener('click', () => {
  alert('Google login clicked (simulation).');
});
document.getElementById('appleLogin').addEventListener('click', () => {
  alert('Apple login clicked (simulation).');
});
document.getElementById('facebookLogin').addEventListener('click', () => {
  alert('Facebook login clicked (simulation).');
});
</script>

<script>
document.getElementById('employeeLogin').addEventListener('click', () => {
  // Example: redirect to employee dashboard page
  window.location.href = 'loginstaff.html';
});
</script>
<!-- FLOATING BUTTONS WRAPPER -->
<div class="fixed bottom-6 right-6 z-50 flex gap-4">

  <!-- HOME BUTTON -->
  <a href="index.html"
   class="w-14 h-14 flex items-center justify-center rounded-full backdrop-blur-xl bg-purple-700/10 border border-purple-400/30 shadow-lg hover:scale-110 transition">
  <i class="fa-solid fa-house text-purple-400 text-xl"></i>
</a>
  </div>
</body>
</html>
