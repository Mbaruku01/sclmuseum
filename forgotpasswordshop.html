<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCL Forgot Password</title>
<script src="https://cdn.tailwindcss.com"></script>

<!-- FAVICON -->
<link rel="icon" type="image/x-icon" href="1000186051.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="1000186051.png">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

<div class="flex flex-col-reverse md:flex-row bg-white rounded-2xl shadow-xl overflow-hidden w-full max-w-3xl">

  <!-- LEFT SIDE: Forgot Password Form -->
  <div class="w-full md:w-1/2 p-6 sm:p-10 flex flex-col justify-center">

    <h2 class="text-2xl sm:text-3xl font-semibold mb-3">Forgot Password?</h2>
    <p class="text-gray-500 mb-6 text-sm sm:text-base">
      Enter your email address below and we'll send you a link to reset your password.
    </p>

    <form id="forgotForm" class="flex flex-col space-y-4">
      <input type="email" id="email" placeholder="Email Address" required
             class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500">
      <button id="sendBtn" type="submit" class="w-full bg-purple-700 text-white py-3 rounded-lg hover:bg-purple-800 transition font-semibold">
        Send Reset Link
      </button>
    </form>

    <p id="timerText" class="text-gray-500 text-sm mt-2 hidden">You can request another link in <span id="countdown">60</span>s</p>

    <div class="flex justify-between items-center mt-4 text-gray-500 text-sm">
      <a href="loginshop.html" class="hover:text-purple-700">Back to Login</a>
      <a href="signupshop.html" class="hover:text-purple-700">Sign Up</a>
    </div>

  </div>

  <!-- RIGHT SIDE: Illustration/Image -->
  <div class="w-full md:w-1/2 h-48 md:h-auto">
    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80" 
         alt="forgotPassword Illustration" class="w-full h-full object-cover">
  </div>

</div>

<script>
const forgotForm = document.getElementById('forgotForm');
const sendBtn = document.getElementById('sendBtn');
const timerText = document.getElementById('timerText');
const countdownEl = document.getElementById('countdown');

let timer = null;

forgotForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();

  if(!email){
    alert("Please enter your email address.");
    return;
  }

  // Simulate sending reset link
  alert(`A password reset link has been sent to ${email}`);

  // Disable button and start timer
  sendBtn.disabled = true;
  sendBtn.classList.add('bg-gray-400', 'cursor-not-allowed');
  timerText.classList.remove('hidden');

  let timeLeft = 60;
  countdownEl.textContent = timeLeft;

  timer = setInterval(() => {
    timeLeft--;
    countdownEl.textContent = timeLeft;

    if(timeLeft <= 0){
      clearInterval(timer);
      sendBtn.disabled = false;
      sendBtn.classList.remove('bg-gray-400', 'cursor-not-allowed');
      timerText.classList.add('hidden');
    }
  }, 1000);

  forgotForm.reset();
});
</script>

</body>
</html>
